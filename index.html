<!DOCTYPE html>
<html lang="pt-BR">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Carta de Amor ❤️</title>

<link rel="stylesheet" href="style.css">

<link href="https://fonts.googleapis.com/css2?family=Great+Vibes&family=Dancing+Script:wght@400;700&family=Poppins:wght@300;400;500;600&display=swap" rel="stylesheet">

</head>

<body>

<!-- ==========================
SENHA INICIAL
========================== -->

<section id="passwordScreen">

<div class="loginCard">

<div class="heartIcon">
❤️
</div>

<h1>Para meu Amor</h1>

<p>Digite a senha para entrar.</p>

<input
id="passwordInput"
type="password"
placeholder="Senha">

<button id="unlockBtn">

Abrir

</button>

<span id="passwordError"></span>

</div>

</section>

<!-- ==========================
EDITOR
========================== -->

<div id="app">

<header>

<h1>❤️ Carta de Amor</h1>

</header>

<div class="container">

<aside class="sidebar">

<h2>Editor</h2>

<input
id="nomeRemetente"
type="text"
placeholder="Seu nome">

<input
id="nomeDestino"
type="text"
placeholder="Nome da pessoa">

<input
id="tituloCarta"
type="text"
placeholder="Título">

<textarea
id="textoCarta"
placeholder="Escreva sua carta..."></textarea>

<button class="save">

💌 Salvar Carta

</button>

</aside>

<main class="paper">

<img
src="img/fotoCasal.jpg"
class="foto">

<h2 id="previewDestino">

Para você ❤️

</h2>

<h1 id="previewTitulo">

Título da Carta

</h1>

<p id="previewTexto">

Sua carta aparecerá aqui enquanto você escreve...

</p>

<h3 id="previewRemetente">

Com amor ❤️

</h3>

</main>

</div>
<!-- ==========================
POPUP SENHA DA CARTA
========================== -->

<div id="senhaCartaPopup">

    <div class="loginCard">

        <div class="heartIcon">
            ❤️
        </div>

        <h2>Senha da Carta</h2>

        <p>Crie uma senha para quem receber a carta.</p>

        <input
            id="senhaCartaInput"
            type="password"
            placeholder="Digite a senha">

        <button id="confirmarSenhaCarta">

            Salvar Carta ❤️

        </button>

    </div>

</div>

<!-- ==========================
POPUP LINK
========================== -->

<div id="savePopup">

    <div class="popupBox">

        <h2>❤️ Carta salva!</h2>

        <p>Compartilhe este link.</p>

        <button id="copyBtn">

            📋 Copiar Link

        </button>

        <button id="whatsappBtn">

            💚 Compartilhar WhatsApp

        </button>

        <button id="closePopup">

            Fechar

        </button>
<button id="discordBtn">
🎮 Compartilhar Discord
</button>
    </div>

</div>

</div>

<script type="module" src="script.js"></script>

</body>

</html>
