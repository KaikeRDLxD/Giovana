<!DOCTYPE html>
<html lang="pt-BR">

<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Carta de Amor ❤️</title>

    <link rel="stylesheet" href="style.css">

    <link href="https://fonts.googleapis.com/css2?family=Great+Vibes&family=Dancing+Script:wght@400;700&family=Poppins:wght@300;400;500;600&display=swap" rel="stylesheet">

</head>

<body>

<!-- ===========================
SENHA
=========================== -->

<section id="passwordScreen">

    <div class="loginCard">

        <div class="heartIcon">
            ❤️
        </div>

        <h1>Para minha princesa</h1>

        <p>Digite a senha para abrir.</p>

        <input
            id="passwordInput"
            type="password"
            placeholder="Senha">

        <button id="unlockBtn">
            Abrir Carta
        </button>

        <span id="passwordError"></span>

    </div>

</section>

<!-- ===========================
ENVELOPE
=========================== -->

<section id="envelopeScreen">

    <div id="envelope">

        <div class="shadow"></div>

        <div class="letter">

            <div class="letterContent">

                <h2></h2>

                <p></p>

            </div>

        </div>

        <div class="back"></div>

        <div class="left"></div>

        <div class="right"></div>

        <div class="bottom"></div>

        <div class="top"></div>

        <div class="waxSeal"></div>

    </div>

</section>

<!-- ===========================
EDITOR
=========================== -->

<div id="app">

<header>

<h1>❤️ Carta de Amor</h1>

</header>

<div class="container">

<aside class="sidebar">

<h2>Editor</h2>

<input
id="nomeRemetente"
type="text"
placeholder="Seu nome">

<input
id="nomeDestino"
type="text"
placeholder="Nome da pessoa">

<input
id="tituloCarta"
type="text"
placeholder="Título da carta">

<textarea
id="textoCarta"
placeholder="Escreva sua carta..."></textarea>

<button class="save">
💌 Salvar Carta
</button>

</aside>

<main class="paper">

<img
src="img/fotoCasal.jpg"
class="foto">

<h2 id="previewDestino">
Para você ❤️
</h2>

<h1 id="previewTitulo">
Título da Carta
</h1>

<p id="previewTexto">

Sua carta aparecerá aqui enquanto você escreve...

</p>

<h3 id="previewRemetente">

Com amor ❤️

</h3>

</main>

</div>

</div>

<!-- ===========================
POPUP
=========================== -->

<div id="savePopup">

<div class="popupBox">

<h2>❤️ Carta salva!</h2>

<p>Compartilhe este link com quem você ama.</p>

<button id="copyBtn">

📋 Copiar Link

</button>

<button id="whatsappBtn">

💚 Compartilhar WhatsApp

</button>

<button id="closePopup">

Fechar

</button>

</div>

</div>

<script type="module" src="script.js"></script>

</body>

</html>
