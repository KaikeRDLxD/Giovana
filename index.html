<!DOCTYPE html>
<html lang="pt-BR">
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Editor de Carta ❤️</title>

<link rel="stylesheet" href="style.css">

<link href="https://fonts.googleapis.com/css2?family=Great+Vibes&family=Poppins:wght@300;400;500;600&display=swap" rel="stylesheet">

</head>

<body>

<div id="app">

<header>

<h1>❤️ Carta de Amor</h1>

</header>

<div class="container">

<aside class="sidebar">

<h2>Editor</h2>

<input id="nomeRemetente" type="text" placeholder="Seu nome">

<input id="nomeDestino" type="text" placeholder="Nome da pessoa">

<input id="tituloCarta" type="text" placeholder="Título da carta">

<textarea id="textoCarta" placeholder="Escreva sua carta..."></textarea>

<button class="save">

💌 Salvar Carta

</button>

</aside>

<main class="paper">

<img src="img/fotoCasal.jpg" class="foto">

<h2 id="previewDestino">

Para você ❤️

</h2>

<h1 id="previewTitulo">

Título da Carta

</h1>

<p id="previewTexto">

Sua carta aparecerá aqui...

</p>

<h3 id="previewRemetente">

Com amor ❤️

</h3>

</main>

</div>

</div>

<div id="senhaCartaPopup">

<div class="loginCard">

<div class="heartIcon">❤️</div>

<h2>Criar senha</h2>

<p>Quem receber esta carta precisará dessa senha.</p>

<input
id="senhaCartaInput"
type="password"
placeholder="Digite a senha">

<button id="confirmarSenhaCarta">

Salvar Carta ❤️

</button>

</div>

</div>

<div id="savePopup">

<div class="popupBox">

<h2>❤️ Carta salva!</h2>

<p>Compartilhe o link abaixo.</p>

<button id="copyBtn">

📋 Copiar Link

</button>

<button id="whatsappBtn">

💚 Compartilhar WhatsApp

</button>

<button id="closePopup">

Fechar

</button>

</div>

</div>

<script type="module" src="script.js"></script>

</body>
</html>
