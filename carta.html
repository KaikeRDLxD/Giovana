<!DOCTYPE html>
<html lang="pt-BR">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>❤️ Carta de Amor</title>

<link rel="stylesheet" href="style.css">

<link href="https://fonts.googleapis.com/css2?family=Great+Vibes&family=Dancing+Script:wght@400;700&family=Poppins:wght@300;400;500;600&display=swap" rel="stylesheet">

</head>

<body>

<!-- ==========================
SENHA DA CARTA
========================== -->

<section id="passwordScreen">

    <div class="loginCard">

        <div class="heartIcon">
            ❤️
        </div>

        <h1>Uma Carta Para Você</h1>

        <p>Digite a senha da carta.</p>

        <input
            id="passwordInput"
            type="password"
            placeholder="Senha">

        <button id="unlockBtn">

            Abrir Carta

        </button>

        <span id="passwordError"></span>

    </div>

</section>

<!-- ==========================
ENVELOPE
========================== -->

<section id="envelopeScreen">

    <div id="envelope">

        <div class="shadow"></div>

        <div class="letter">

            <div class="letterContent"></div>

        </div>

        <div class="back"></div>

        <div class="left"></div>

        <div class="right"></div>

        <div class="bottom"></div>

        <div class="top"></div>

        <div class="waxSeal"></div>

    </div>

</section>

<!-- ==========================
CARTA
========================== -->

<div id="app">

    <div class="container">

        <main class="paper">

            <img
                src="img/fotoCasal.jpg"
                class="foto">

            <h2 id="destino"></h2>

            <h1 id="tituloCarta"></h1>

            <p id="textoCarta"></p>

            <h3 id="remetente"></h3>

        </main>

    </div>

</div>

<script type="module" src="carta.js"></script>

</body>
</html>
