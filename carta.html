<!DOCTYPE html>
<html lang="pt-BR">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Uma carta para você ❤️</title>

<link rel="stylesheet" href="style.css">

<link href="https://fonts.googleapis.com/css2?family=Great+Vibes&family=Dancing+Script:wght@400;700&family=Poppins:wght@300;400;500;600&display=swap" rel="stylesheet">

</head>


<body>


<!-- SENHA -->

<section id="passwordScreen">

    <div class="loginCard">

        <div class="heartIcon">
            ❤️
        </div>


        <h1>Para você</h1>

        <p>Digite a senha para abrir.</p>


        <input
        id="passwordInput"
        type="password"
        placeholder="Senha">


        <button id="unlockBtn">
            Abrir Carta
        </button>


        <span id="passwordError"></span>


    </div>

</section>



<!-- ENVELOPE -->

<section id="envelopeScreen">


<div id="envelope">


<div class="shadow"></div>


<div class="letter">

<div class="letterContent">

<h2></h2>

<p></p>

</div>

</div>



<div class="back"></div>

<div class="left"></div>

<div class="right"></div>

<div class="bottom"></div>

<div class="top"></div>


<div class="waxSeal">

</div>


</div>


</section>



<!-- CARTA FINAL -->


<div id="app">


<header>

<h1>❤️ Carta de Amor</h1>

</header>



<div class="container">


<main class="paper">


<img src="img/fotoCasal.jpg" class="foto">


<h3 id="destino"></h3>

<h1 id="tituloCarta">
Carregando...
</h1>

<p id="textoCarta">
Carregando carta...
</p>

<h2 id="remetente">
Com amor ❤️
</h2>


</main>


</div>


</div>



<script type="module" src="carta.js"></script>

</body>

</html>
